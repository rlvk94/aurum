name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: true

      - name: Lint
        run: npx eslint .
        env:
          SKIP_ENV_VALIDATION: true

      - name: Run tests
        run: npm test
        env:
          SKIP_ENV_VALIDATION: true

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          SKIP_ENV_VALIDATION: true
